<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <title>Tic-Tac-Toe</title>
    </head>
    <body>
        <h1>Welcome to Tic-Tac-Toe</h1>

        <div class="container">
            <h2 class="turn">Player turn...</h2>
            <div class="board">
                <div class="cell-selection" id="1">X</div>
                <div class="cell-selection" id="2">O</div>
                <div class="cell-selection" id="3"></div>
                <div class="cell-selection" id="4">X</div>
                <div class="cell-selection" id="5"></div>
                <div class="cell-selection" id="6"></div>
                <div class="cell-selection" id="7"></div>
                <div class="cell-selection" id="8"></div>
                <div class="cell-selection" id="9">O</div>
            </div>
        </div>
        <script src="script.js" defer></script>
    </body>
</html>
