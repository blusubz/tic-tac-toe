<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <title>Tic-Tac-Toe</title>
    </head>
    <body>
        <h1>Welcome to Tic-Tac-Toe</h1>

        <div class="container">
            <h2 class="turn"></h2>
            <div class="board">
                <div class="cell-selection" id="0"></div>
                <div class="cell-selection" id="1"></div>
                <div class="cell-selection" id="2"></div>
                <div class="cell-selection" id="3"></div>
                <div class="cell-selection" id="4"></div>
                <div class="cell-selection" id="5"></div>
                <div class="cell-selection" id="6"></div>
                <div class="cell-selection" id="7"></div>
                <div class="cell-selection" id="8"></div>
            </div>
        </div>

        <div class="game-btns-container">
            <button id="openModal">Start Game</button>

            <form method="dialog" id="player-inputs">
                <dialog id="dialog">
                    <h2>Player 1, enter your name and select marker:</h2>
                    <label>
                        Name
                        <input type="text" id="player1-name">
                    </label>

                    <fieldset>
                        <legend>Select your marker:</legend>

                        <label>
                            <input type="radio" id="marker-x" name="marker" value="x" checked>
                            X
                        </label>

                        <label>
                            <input type="radio" id="marker-o" name="marker" value="o">
                            O
                        </label>
                    </fieldset>

                    <h2>Player 2, enter your name:</h2>
                    <label>
                        Name
                        <input type="text" id="player2-name">
                    </label>
                    <button type="submit" id="submitBtn">Submit</button>
                </dialog>
            </form>

            <button>Restart Game</button>
        </div>
        <script src="script.js" defer></script>
    </body>
</html>
